<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#4e3c79" />
      <stop offset="50%" stop-color="#2c2250" />
      <stop offset="100%" stop-color="#141126" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Ring with Compass Ticks -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Helm Handles (8 spokes) -->
  <g id="helm-wheel" stroke="url(#goldGrad)" stroke-linecap="round">
    <!-- Handles (spokes extending outward) -->
    <!-- N (0) -->
    <line x1="256" y1="96" x2="256" y2="40" stroke-width="14" />
    <circle cx="256" cy="36" r="10" fill="url(#goldGrad)" />
    <!-- NE (45) -->
    <line x1="369" y1="143" x2="408" y2="104" stroke-width="14" />
    <circle cx="411" cy="101" r="10" fill="url(#goldGrad)" />
    <!-- E (90) -->
    <line x1="416" y1="256" x2="472" y2="256" stroke-width="14" />
    <circle cx="476" cy="256" r="10" fill="url(#goldGrad)" />
    <!-- SE (135) -->
    <line x1="369" y1="369" x2="408" y2="408" stroke-width="14" />
    <circle cx="411" cy="411" r="10" fill="url(#goldGrad)" />
    <!-- S (180) -->
    <line x1="256" y1="416" x2="256" y2="472" stroke-width="14" />
    <circle cx="256" cy="476" r="10" fill="url(#goldGrad)" />
    <!-- SW (225) -->
    <line x1="143" y1="369" x2="104" y2="408" stroke-width="14" />
    <circle cx="101" cy="411" r="10" fill="url(#goldGrad)" />
    <!-- W (270) -->
    <line x1="96" y1="256" x2="40" y2="256" stroke-width="14" />
    <circle cx="36" cy="256" r="10" fill="url(#goldGrad)" />
    <!-- NW (315) -->
    <line x1="143" y1="143" x2="104" y2="104" stroke-width="14" />
    <circle cx="101" cy="101" r="10" fill="url(#goldGrad)" />

    <!-- Wheel Outer Rim -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="18" filter="url(#glow)" />
    
    <!-- Wheel Inner Rim -->
    <circle cx="256" cy="256" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.8" />

    <!-- Spokes connecting hub to rim -->
    <line x1="256" y1="256" x2="256" y2="106" stroke-width="12" />
    <line x1="256" y1="256" x2="362" y2="150" stroke-width="12" />
    <line x1="256" y1="256" x2="406" y2="256" stroke-width="12" />
    <line x1="256" y1="256" x2="362" y2="362" stroke-width="12" />
    <line x1="256" y1="256" x2="256" y2="406" stroke-width="12" />
    <line x1="256" y1="256" x2="150" y2="362" stroke-width="12" />
    <line x1="256" y1="256" x2="106" y2="256" stroke-width="12" />
    <line x1="256" y1="256" x2="150" y2="150" stroke-width="12" />
  </g>

  <!-- Central Compass Hub -->
  <circle cx="256" cy="256" r="58" fill="#1e1838" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Compass Star / Direction Arrow in Hub -->
  <polygon points="256,206 266,250 256,244 246,250" fill="#f43f5e" />
  <polygon points="256,306 266,262 256,268 246,262" fill="#cbd5e1" />
  <polygon points="206,256 250,246 244,256 250,266" fill="#94a3b8" />
  <polygon points="306,256 262,246 268,256 262,266" fill="#94a3b8" />
  <circle cx="256" cy="256" r="8" fill="#ffd56b" />
</svg>
